{% extends "base.html" %}
{% block title %}{{ title }} · Support Eval{% endblock %}
{% block content %}
<section class="error-state">
  <span class="error-symbol" aria-hidden="true">!</span>
  <p class="eyebrow">Something needs attention</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="button button-primary" href="{{ url_for('index') }}">Start a new evaluation</a>
</section>
{% endblock %}
